services:
  allos-mcp:
    build: ..
    user: "${ALLOS_UID:-1000}:${ALLOS_GID:-1000}"
    environment:
      ALLOS_DB_PATH: /data/allos.db
      ALLOS_PROFILE_ID: "${ALLOS_PROFILE_ID:?set ALLOS_PROFILE_ID}"
    volumes:
      # Mount the full directory for SQLite WAL/SHM access.
      - "${ALLOS_DATA_DIR:?set ALLOS_DATA_DIR}:/data:ro"
    ports:
      # Loopback only. Never expose unauthenticated medical data directly.
      - "127.0.0.1:8765:8765"
    command: ["--transport", "http", "--host", "0.0.0.0", "--allow-nonloopback"]
    restart: unless-stopped
