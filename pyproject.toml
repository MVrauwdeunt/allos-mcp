
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "allos-mcp"
version = "0.1.2"
description = "Read-only MCP integration for the Allos personal health database"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
authors = [{name = "Allos MCP contributors"}]
dependencies = ["mcp>=1.12,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
allos-mcp = "allos_mcp.server:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
